<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#11202A">
<title>ファインダー付きブラウザ</title>
<style>
  :root{
    --chrome:#11202A;
    --chrome-soft:#1C303D;
    --line:#2E4552;
    --paper:#EFF2F3;
    --text:#E8EEF1;
    --text-dim:#8FA6B3;
    --signal:#D93A2B;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{height:100dvh}
  body{
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
    background:var(--chrome);color:var(--text);
    display:flex;flex-direction:column;overflow:hidden;
  }

  /* ---- toolbar ---- */
  .bar{
    flex:0 0 auto;display:flex;gap:8px;align-items:center;
    padding:calc(8px + env(safe-area-inset-top)) 10px 8px;
    background:var(--chrome);border-bottom:1px solid var(--line);
  }
  .bar input{
    flex:1;min-width:0;height:40px;padding:0 14px;
    border:1px solid var(--line);border-radius:999px;
    background:var(--chrome-soft);color:var(--text);
    font:inherit;font-size:16px;
  }
  .bar input::placeholder{color:var(--text-dim)}
  .bar input:focus{outline:2px solid #5AA9C9;outline-offset:1px}
  .bar button{
    height:40px;padding:0 14px;border:0;border-radius:999px;
    background:#5AA9C9;color:#08151C;font:inherit;font-weight:700;font-size:14px;
  }
  .bar button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .bar #tab{
    padding:0 12px;background:var(--chrome-soft);color:var(--text);
    border:1px solid var(--line);font-weight:400;font-size:16px;
  }

  /* ---- content ---- */
  .stage{position:relative;flex:1;min-height:0;background:var(--paper)}
  iframe{width:100%;height:100%;border:0;display:block;background:var(--paper)}
  .empty{
    position:absolute;inset:0;display:grid;place-content:center;gap:10px;
    padding:28px;text-align:center;color:#5B6B76;
  }
  .empty h1{margin:0;font-size:19px;font-weight:700;color:#22323D;line-height:1.5}
  .empty p{margin:0;font-size:14px;line-height:1.7;max-width:34ch}

  .note{
    position:absolute;left:10px;right:10px;bottom:10px;
    display:none;gap:10px;align-items:center;
    padding:11px 12px;border-radius:12px;
    background:#22323D;color:var(--text);font-size:13px;line-height:1.5;
    box-shadow:0 6px 22px rgba(10,20,28,.28);
  }
  .note.on{display:flex}
  .note button{
    flex:0 0 auto;border:0;border-radius:8px;padding:8px 10px;
    background:#5AA9C9;color:#08151C;font:inherit;font-weight:700;font-size:13px;
  }

  /* ---- camera ---- */
  .cam{
    position:fixed;width:150px;z-index:30;
    border-radius:var(--radius);overflow:hidden;
    background:#0B151B;border:1px solid rgba(255,255,255,.18);
    box-shadow:0 10px 30px rgba(8,16,22,.45);
    touch-action:none;user-select:none;
  }
  .cam.dragging{box-shadow:0 16px 40px rgba(8,16,22,.6);cursor:grabbing}
  /* 指を離したあとの吸着だけをアニメーションさせる */
  .cam.snap{transition:left .26s cubic-bezier(.22,1,.36,1), top .26s cubic-bezier(.22,1,.36,1)}
  .cam video{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#0B151B}
  .cam.mirror video{transform:scaleX(-1)}

  .grab{
    position:absolute;top:0;left:0;right:0;height:30px;cursor:grab;z-index:1;
    background:linear-gradient(rgba(8,16,22,.65),transparent);
    display:flex;align-items:center;gap:6px;padding:0 8px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--signal)}
  .grab span{font-size:11px;color:rgba(255,255,255,.78);font-weight:600}
  .grab .hbtn{margin-left:auto;border:0;background:transparent;color:rgba(255,255,255,.85);font-size:15px;padding:2px 6px;line-height:1}
  .grab .grip{color:rgba(255,255,255,.6);font-size:13px;letter-spacing:2px}

  .cam-ctl{
    position:absolute;left:0;right:0;bottom:0;
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 10px;background:linear-gradient(transparent,rgba(8,16,22,.8));
  }
  .cam-ctl button{
    border:0;background:rgba(255,255,255,.16);color:#fff;
    width:30px;height:30px;border-radius:50%;font-size:14px;line-height:1;
  }
  .shutter{
    width:46px!important;height:46px!important;border-radius:50%!important;
    background:#fff!important;border:3px solid rgba(255,255,255,.45)!important;
    padding:0;
  }
  .shutter:active{transform:scale(.92)}
  .cam-msg{
    position:absolute;inset:0;display:none;place-content:center;
    padding:16px;text-align:center;font-size:12px;line-height:1.65;color:#CFE0E8;
  }
  .cam.err .cam-msg{display:grid}
  .cam-msg p{margin:0 0 10px}
  .cam-msg button{border:0;border-radius:999px;padding:9px 14px;background:#5AA9C9;color:#08151C;font:inherit;font-weight:700;font-size:13px}
  .cam.err video,.cam.err .cam-ctl{visibility:hidden}

  /* ---- 収納（非表示）：撮影と復帰だけの小さなバー ---- */
  .cam.stowed{width:104px!important;height:48px;border-radius:24px}
  /* 映像は display:none にしない（止めると非表示のまま撮影できない）。
     不透明なバーで覆い、枠の overflow:hidden で切り取って見せない。 */
  .cam.stowed .cam-ctl,.cam.stowed .grab,.cam.stowed .cam-msg{display:none}
  .cam.stowed .mini{display:flex}
  .mini{
    display:none;position:absolute;inset:0;z-index:2;
    align-items:center;justify-content:center;gap:12px;background:#0B151B;
  }
  .mini button{border:0;padding:0;line-height:1}
  .mini-shot{
    width:30px;height:30px;border-radius:50%;
    background:#fff;border:2px solid rgba(255,255,255,.45);
  }
  .mini-shot:active{transform:scale(.92)}
  .mini-open{
    width:30px;height:30px;border-radius:9px;
    background:rgba(255,255,255,.16);color:#fff;font-size:15px;
  }

  /* ---- shots ---- */
  .shots{
    position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:6px;z-index:20;max-width:60vw;overflow-x:auto;padding:2px;
  }
  .shots a{
    flex:0 0 auto;width:46px;height:60px;border-radius:8px;overflow:hidden;
    border:1px solid rgba(255,255,255,.5);box-shadow:0 4px 14px rgba(8,16,22,.35);
  }
  .shots img{width:100%;height:100%;object-fit:cover;display:block}
</style>
</head>
<body>

<div class="bar">
  <input id="q" type="text" inputmode="url" placeholder="検索ワード、または URL" autocomplete="off">
  <button id="go">開く</button>
  <button id="tab" title="いま開いているページを新しいタブで開く">↗</button>
</div>

<div class="stage">
  <iframe id="view" title="ウェブ表示" referrerpolicy="no-referrer"></iframe>
  <div class="empty" id="empty">
    <h1>調べながら、撮る</h1>
    <p>上のバーに検索ワードかURLを入れると、ここに表示されます。カメラはドラッグで移動、ピンチで伸縮、画面の外へ払うと隠れます。</p>
  </div>
  <div class="note" id="note">
    <div id="noteText">このサイトは埋め込み表示を拒否しています。</div>
    <button id="noteOpen">新しいタブで開く</button>
  </div>
</div>

<div class="cam" id="cam" style="left:0;top:0">
  <div class="grab" id="grab">
    <i class="dot"></i><span>カメラ</span><button id="pip" class="hbtn" title="画面に浮かせる">⧉</button><button id="hide" class="hbtn" title="隠す">✕</button><i class="grip">⋮⋮</i>
  </div>
  <div class="mini">
    <button id="miniShot" class="mini-shot" title="撮影（カメラを表示せずに撮る）"></button>
    <button id="stow" class="mini-open" title="カメラを表示">▣</button>
  </div>
  <video id="video" playsinline autoplay muted></video>
  <div class="cam-ctl">
    <button id="flip" title="前後切り替え">⟳</button>
    <button class="shutter" id="shot" title="撮影"></button>
    <button id="size" title="大きさを変える（ピンチでも伸縮できます）">⤢</button>
  </div>
  <div class="cam-msg" id="camMsg"><p id="camText"></p><button id="retry">カメラを開始</button></div>
</div>

<div class="shots" id="shots"></div>
<canvas id="canvas" hidden></canvas>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const cam = $('cam'), video = $('video'), camText = $('camText');
  const view = $('view'), empty = $('empty'), note = $('note');

  /* ---------- ブラウザ部分 ---------- */
  /* 起動時に開くページ。https://www.google.com/ は X-Frame-Options で枠内表示を
     拒否するため、枠内に表示できる Google 検索（igu=1）を使う。 */
  const HOME = 'https://www.google.com/search?igu=1';
  const SEARCH = 'https://www.google.com/search?igu=1&q=';
  let lastUrl = '', check = 0;

  function toUrl(raw){
    const s = raw.trim();
    if(!s) return '';
    if(/^https?:\/\//i.test(s)) return s;
    if(/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(s) && !/\s/.test(s)) return 'https://' + s;
    return SEARCH + encodeURIComponent(s);
  }

  function open(raw){
    const url = toUrl(raw);
    if(!url) return;
    lastUrl = url;
    note.classList.remove('on');
    empty.style.display = 'none';
    clearTimeout(check);
    let loaded = false;
    view.onload = () => { loaded = true; };
    view.src = url;
    /* 枠内表示を拒否するサイトは親ページから判別できないため、読み込みが
       始まらない場合にだけ案内を出し、いつでも別タブで開けるようにしておく */
    check = setTimeout(() => {
      if(!loaded){
        $('noteText').textContent = 'このページは埋め込み表示を拒否しているようです。';
        note.classList.add('on');
      }
    }, 2600);
  }

  $('go').onclick = () => open($('q').value);
  $('q').addEventListener('keydown', e => { if(e.key === 'Enter') open($('q').value); });
  function openTab(){ if(lastUrl) window.open(lastUrl, '_blank', 'noopener'); }
  $('noteOpen').onclick = openTab;
  $('tab').onclick = openTab;

  /* ---------- カメラ ---------- */
  let stream = null, facing = 'environment';

  /* 無音を徹底する：音声は取らない・映像要素も常にミュート */
  function silence(){
    video.muted = true;
    video.defaultMuted = true;
    video.volume = 0;
    if(stream) stream.getAudioTracks().forEach(t => {
      t.enabled = false;
      t.stop();
      stream.removeTrack(t);
    });
  }
  silence();

  async function start(){
    stop();
    try{
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        throw new Error('unsupported');
      }
      stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode: facing, width:{ideal:1280}, height:{ideal:1280} },
        audio:false
      });
      silence();
      video.srcObject = stream;
      try{ await video.play(); }catch(_){}
      cam.classList.remove('err');
      cam.classList.toggle('mirror', facing === 'user');
    }catch(e){
      const n = e && e.name;
      let msg = 'カメラを起動できません。';
      if(n === 'NotAllowedError') msg = 'カメラの使用が許可されていません。ブラウザのアドレスバーから許可してください。';
      else if(n === 'NotFoundError') msg = 'カメラが見つかりません。';
      else if(!window.isSecureContext) msg = 'HTTPS または localhost で開くとカメラを使えます。';
      else if(e.message === 'unsupported') msg = 'このブラウザはカメラに対応していません。';
      else msg = 'カメラを起動できません（' + (n || 'エラー') + '）。このページを別タブで開くと動く場合があります。';
      camText.textContent = msg;
      cam.classList.add('err');
    }
  }
  function stop(){ if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } }

  $('retry').onclick = () => start();

  /* iOS: 映像を画面に浮かせる（ピクチャインピクチャ） */
  $('pip').onclick = async () => {
    try{
      if(video.webkitSetPresentationMode){
        video.webkitSetPresentationMode(video.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture');
      }else if(document.pictureInPictureElement){
        await document.exitPictureInPicture();
      }else if(video.requestPictureInPicture){
        await video.requestPictureInPicture();
      }else{
        throw new Error('no-pip');
      }
    }catch(e){
      $('noteText').textContent = 'このブラウザではカメラ映像を浮かせられません。アプリ内の小窓をそのままお使いください。';
      $('note').classList.add('on');
    }
  };

  $('flip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; start(); };

  /* 撮影（音も光も出さない。カメラを非表示にしていても撮れる） */
  function shoot(){
    if(!stream) return start();
    const c = $('canvas'), w = video.videoWidth, h = video.videoHeight;
    if(!w) return;
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    if(facing === 'user'){ ctx.translate(w, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, 0, 0, w, h);
    c.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const t = new Date();
      const pad = n => String(n).padStart(2, '0');
      a.href = url;
      a.download = `shot-${t.getFullYear()}${pad(t.getMonth()+1)}${pad(t.getDate())}-${pad(t.getHours())}${pad(t.getMinutes())}${pad(t.getSeconds())}.jpg`;
      a.title = 'タップで保存';
      a.innerHTML = '<img alt="撮影した写真">';
      a.querySelector('img').src = url;
      const s = $('shots');
      s.prepend(a);
      while(s.children.length > 6) s.lastChild.remove();
    }, 'image/jpeg', 0.92);
  }
  $('shot').onclick = shoot;
  $('miniShot').onclick = shoot;

  /* 大きさ：ボタンは決まった段階で切り替える（ピンチ後も実寸から続く） */
  const sizes = [130, 180, 240, 300];
  $('size').onclick = () => {
    const w = cam.getBoundingClientRect().width;
    const list = sizes.filter(v => v <= maxWidth());
    const steps = list.length ? list : [MIN_W];
    setWidth(steps.find(v => v > w + 1) || steps[0]);
    clamp();
  };

  /* 収納（非表示）と復帰 */
  function stow(){
    cam.classList.add('stowed');
    settle();
  }
  function show(){
    if(!cam.classList.contains('stowed')) return;
    cam.classList.remove('stowed');
    setWidth(cam.getBoundingClientRect().width);
    settle();
  }
  $('hide').onclick = stow;
  $('stow').onclick = show;

  /* つかみバーをダブルタップでも収納できる
     （ドラッグ中は click の対象が枠に移るため、位置で判定する） */
  cam.addEventListener('dblclick', e => {
    if(cam.classList.contains('stowed')) return;
    const r = cam.getBoundingClientRect();
    if(e.clientY - r.top <= 30) stow();
  });

  /* ---------- 移動（1本指）とピンチ伸縮（2本指） ---------- */
  const MIN_W = 130, MAX_W = 520, EDGE = 8;   // MIN_W: 操作ボタンが収まる最小幅
  let pos = {x:0, y:0}, drag = null, pinch = null, noClickUntil = 0;
  const pointers = new Map();

  function place(x, y){ pos = {x, y}; cam.style.left = x + 'px'; cam.style.top = y + 'px'; }

  /* 上端は検索バーの下まで */
  function topLimit(){
    return Math.round(document.querySelector('.bar').getBoundingClientRect().bottom) + EDGE;
  }

  /* 画面に収まる最大幅（高さは幅の約4/3なので縦も見る） */
  function maxWidth(){
    return Math.max(MIN_W, Math.min(
      MAX_W,
      window.innerWidth - EDGE * 2,
      (window.innerHeight - topLimit() - EDGE) * 0.75
    ));
  }

  function setWidth(w){
    cam.style.width = Math.round(Math.max(MIN_W, Math.min(w, maxWidth()))) + 'px';
  }

  function clamp(){
    const r = cam.getBoundingClientRect();
    const top = topLimit();
    const maxX = window.innerWidth - r.width - EDGE;
    const maxY = window.innerHeight - r.height - EDGE;
    place(Math.max(EDGE, Math.min(pos.x, maxX)), Math.max(top, Math.min(pos.y, maxY)));
  }

  /* いちばん近い角へ、するっと収める（PiP と同じ感覚） */
  let snapTimer = 0;
  function settle(){
    const r = cam.getBoundingClientRect();
    const top = topLimit();
    const x = r.left + r.width / 2 < window.innerWidth / 2
      ? EDGE : Math.max(EDGE, window.innerWidth - r.width - EDGE);
    const y = r.top + r.height / 2 < (top + window.innerHeight) / 2
      ? top : Math.max(top, window.innerHeight - r.height - EDGE);
    cam.classList.add('snap');
    place(x, y);
    clearTimeout(snapTimer);
    snapTimer = setTimeout(() => cam.classList.remove('snap'), 320);
  }

  /* 2本指の間隔 */
  function spread(){
    const [a, b] = [...pointers.values()];
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function startDrag(x, y, onButton){
    const r = cam.getBoundingClientRect();
    drag = {dx: x - r.left, dy: y - r.top, sx: x, sy: y, moved: false, onButton: !!onButton};
    cam.classList.add('dragging');
  }

  function capture(id){ try{ cam.setPointerCapture(id); }catch(_){} }

  cam.addEventListener('pointerdown', e => {
    const onButton = e.target.closest('button');
    // 最初の指なら、前のジェスチャーの取りこぼしを捨てる（残ると2本指扱いになる）
    if(e.isPrimary) pointers.clear();
    // ボタンのタップは邪魔しない。ただし2本目の指と、収納中（小さなバー）は拾う
    if(pointers.size === 0 && onButton && !cam.classList.contains('stowed')) return;
    pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
    // ボタンの上では、動かし始めるまで捕捉しない（捕捉すると click が枠に移り、
    // ボタン本来の動作が起きなくなる）
    if(!onButton) capture(e.pointerId);

    if(pointers.size === 1){
      startDrag(e.clientX, e.clientY, onButton);
    }else if(pointers.size === 2 && !cam.classList.contains('stowed')){
      const r = cam.getBoundingClientRect();
      drag = null;
      cam.classList.remove('dragging');
      pointers.forEach((_, id) => capture(id));
      pinch = {
        dist: spread(),
        width: r.width,
        cx: r.left + r.width / 2,
        cy: r.top + r.height / 2
      };
    }
  });

  cam.addEventListener('pointermove', e => {
    const p = pointers.get(e.pointerId);
    if(!p) return;
    p.x = e.clientX; p.y = e.clientY;

    if(pinch && pointers.size >= 2){
      if(!pinch.dist) return;
      setWidth(pinch.width * (spread() / pinch.dist));
      // 枠の中心を保ったまま伸縮させる
      const r = cam.getBoundingClientRect();
      place(pinch.cx - r.width / 2, pinch.cy - r.height / 2);
      clamp();
      noClickUntil = performance.now() + 350;
    }else if(drag){
      if(!drag.moved){
        if(Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) <= 6) return;
        drag.moved = true;
        if(drag.onButton) capture(e.pointerId);
      }
      place(e.clientX - drag.dx, e.clientY - drag.dy);
    }
  });

  function endDrag(){
    drag = null;
    cam.classList.remove('dragging');
    const r = cam.getBoundingClientRect();
    // 画面の外へ大きく払ったら収納する
    const offX = Math.max(0, -r.left, r.right - window.innerWidth);
    const offY = Math.max(0, topLimit() - r.top, r.bottom - window.innerHeight);
    if(offX > r.width * 0.35 || offY > r.height * 0.5) stow();
    else settle();
  }

  function release(e){
    const tracked = pointers.delete(e.pointerId);
    if(pinch && pointers.size < 2){
      pinch = null;
      if(pointers.size === 1){
        // 指が1本残っていれば、そのまま移動を続けられるようにする
        const [p] = [...pointers.values()];
        startDrag(p.x, p.y);
        return;
      }
    }
    // 収納した枠（全面がボタン）を動かしたときは、復帰させない
    if(drag && drag.moved && drag.onButton) noClickUntil = performance.now() + 350;
    // 追跡していない指（ボタンのタップ）で枠を動かすと click が発火しなくなる
    if(tracked && pointers.size === 0) endDrag();
  }
  cam.addEventListener('pointerup', release);
  cam.addEventListener('pointercancel', release);

  /* ピンチや移動の直後に、撮影などが誤発火しないようにする */
  cam.addEventListener('click', e => {
    if(performance.now() < noClickUntil){
      e.stopPropagation();
      e.preventDefault();
    }
  }, true);

  /* トラックパッドのピンチ（ctrl+ホイール）でも伸縮できるようにする */
  cam.addEventListener('wheel', e => {
    if(!e.ctrlKey || cam.classList.contains('stowed')) return;
    e.preventDefault();
    const r = cam.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    setWidth(r.width * Math.max(0.8, Math.min(1.2, 1 - e.deltaY / 100)));
    const n = cam.getBoundingClientRect();
    place(cx - n.width / 2, cy - n.height / 2);
    clamp();
  }, {passive:false});

  window.addEventListener('resize', () => {
    setWidth(cam.getBoundingClientRect().width);
    clamp();
  });

  /* 指の状態を取りこぼしたまま残さない（タブ移動などで pointerup が来ない場合） */
  window.addEventListener('blur', () => {
    pointers.clear();
    drag = null; pinch = null;
    cam.classList.remove('dragging');
  });

  /* 初期位置：右下 */
  function init(){
    setWidth(cam.getBoundingClientRect().width);   // 小さい画面でも収まるように
    const r = cam.getBoundingClientRect();
    place(window.innerWidth - r.width - EDGE, window.innerHeight - r.height - EDGE);
    clamp();
  }
  init();
  start();
  open(HOME);
})();
</script>
</body>
</html>
